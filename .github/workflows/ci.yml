name: CI

# Só `push`: com `pull_request` junto, cada commit de uma branch com PR aberto
# dispararia dois runs completos (o `concurrency` não deduplica entre eventos,
# porque a chave `github.ref` difere). Os checks aparecem no PR do mesmo jeito.
on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Test
    # Runner por variável de repositório. Sem `vars.CI_RUNNER` o default é o hosted
    # `ubuntu-latest` — que é o que este template público usa. O valor precisa ser
    # JSON: `'["self-hosted","desenrolai"]'` são DOIS labels; a string
    # `self-hosted,desenrolai` seria UM label só, que nenhum runner atende.
    # Repo privado gerado a partir daqui: ver README → CI.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # Pega incompatibilidade de versão com o SDK que o build local esconde.
      - name: Expo doctor
        run: npm run doctor
