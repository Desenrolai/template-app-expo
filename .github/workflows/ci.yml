name: CI

# `push` só na branch default; todo o resto é coberto por `pull_request`.
#
# Com `push: ["**"]` e `pull_request` juntos, cada commit de uma branch com PR
# aberto dispara DOIS runs completos do mesmo SHA. O `concurrency` abaixo NÃO
# deduplica: a chave usa `github.ref`, que é `refs/heads/<branch>` no push e
# `refs/pull/<n>/merge` no pull_request — grupos diferentes, zero cancelamento.
# Medido em repo gerado: o mesmo SHA com um run `success` e outro `failure`.
#
# Remover `pull_request` também mataria a duplicação, mas deixaria PR de fork sem
# CI nenhum (o push do fork não dispara no repo base) — e este template é público.
# Fixado por teste: tooling/ci-wiring.test.ts
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck & Test
    # Runner por variável de repositório. Sem `vars.CI_RUNNER` o default é o hosted
    # `ubuntu-latest` — que é o que este template público usa. O valor precisa ser
    # JSON: `'["self-hosted","desenrolai"]'` são DOIS labels; a string
    # `self-hosted,desenrolai` seria UM label só, que nenhum runner atende.
    # Repo privado gerado a partir daqui: ver README → CI.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # Pega incompatibilidade de versão com o SDK que o build local esconde.
      - name: Expo doctor
        run: npm run doctor
